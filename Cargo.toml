[package]
name = "dearust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false
description = "Dearust: Rust ports of Darling host utilities"
repository = "https://github.com/countradooku/dearust"

[workspace]
members = ["xtask", "crates/dearust-coredump", "crates/dearust-libsimple", "crates/dearust-errno", "crates/dearust-futex", "crates/dearust-lockset", "crates/dearust-process", "crates/dearust-guarded", "crates/dearust-lstat", "crates/dearust-fstatat", "crates/dearust-symlinkat", "crates/dearust-readlinkat", "crates/dearust-unlinkat", "crates/dearust-linkat", "crates/dearust-renameat", "crates/dearust-mkdirat", "crates/dearust-faccessat", "crates/dearust-fchmodat", "crates/dearust-fchmod", "crates/dearust-ftruncate", "crates/dearust-fsync", "crates/dearust-fdatasync"]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "metadata"
harness = false
