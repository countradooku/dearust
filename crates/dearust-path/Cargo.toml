[package]
name = "dearust-path"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"
description = "Bounded allocation-free pathname operations for Darling's x86_64 runtime"

[features]
default = ["runtime"]
runtime = []
host-filesystem = []

[dependencies]
dearust-errno = { path = "../dearust-errno" }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
