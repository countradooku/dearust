[package]
name = "dearust-process"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"
description = "Darling process identifiers and process/vnode queries"
[features]
default = ["queries", "identifiers", "resources"]
queries = []
identifiers = ["dep:dearust-errno"]
resources = ["dep:dearust-errno"]

[dependencies]
dearust-errno = { path = "../dearust-errno", optional = true }

[lib]
name = "dearust_process"
crate-type = ["rlib"]
[lints.clippy]
undocumented_unsafe_blocks = "deny"
